<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Página de login do Marca-Página, onde é possível acessar a conta de membro do clube de leitura.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400..700&family=Source+Sans+3:wght@200..900&display=swap"
      rel="stylesheet"
   >
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
   >
    <link rel="stylesheet" href="./style/global.css">
    <link rel="stylesheet" href="./style/form.css">
    <title>Login - Marca-Página</title>
  </head>
  <body>
    <header class="topo">
      <div class="container">
        <a class="logo" href="index.html">
          <i class="bi bi-bookmark-fill" aria-hidden="true"></i>
          Marca-Página
        </a>
        <nav aria-label="Menu principal">
          <ul>
            <li><a href="index.html">Início</a></li>
            <li><a href="cadastro.html">Cadastro</a></li>
            <li><a href="login.html" aria-current="page">Login</a></li>
            <li>
              <a href="admin.html">
                <i class="bi bi-person-circle" aria-hidden="true"></i>
                Admin
              </a>
            </li>
          </ul>
        </nav>
      </div>
    </header>

    <main class="container">
      <section class="form-box">
        <h1>Login</h1>
        <form action="index.html">
          <label>
            E-mail
            <input type="email" autocomplete="email" required>
          </label>
          <label>
            Senha
            <input type="password" autocomplete="current-password" required>
          </label>
          <button class="btn" type="submit">Entrar</button>
        </form>
        <p class="form-aviso">
          Ainda não é membro? <a href="cadastro.html">Crie sua conta</a>.
        </p>
      </section>
    </main>

    <footer class="rodape">
      <p>
        Feito por Luiz Henrique Felix para a disciplina ES44C - Programação Web
        Front-End, UTFPR.
      </p>
      <a href="./curriculo.pdf">
        <i class="bi bi-file-earmark-person" aria-hidden="true"></i>
        Meu Currículo
      </a>
    </footer>
  </body>
</html>

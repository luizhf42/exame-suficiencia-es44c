<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Página de administração do Marca-Página, onde é possível cadastrar e gerenciar usuários do clube de leitura.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400..700&family=Source+Sans+3:wght@200..900&display=swap"
      rel="stylesheet"
   >
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
   >
    <link rel="stylesheet" href="./style/global.css">
    <link rel="stylesheet" href="./style/form.css">
    <link rel="stylesheet" href="./style/admin.css">
    <title>Admin - Marca-Página</title>
  </head>
  <body>
    <header class="topo">
      <div class="container">
        <a class="logo" href="index.html">
          <i class="bi bi-bookmark-fill" aria-hidden="true"></i>
          Marca-Página
        </a>
        <nav aria-label="Menu principal">
          <ul>
            <li><a href="index.html">Início</a></li>
            <li><a href="cadastro.html">Cadastro</a></li>
            <li><a href="login.html">Login</a></li>
            <li>
              <a href="admin.html" aria-current="page">
                <i class="bi bi-person-circle" aria-hidden="true"></i>
                Admin
              </a>
            </li>
          </ul>
        </nav>
      </div>
    </header>

    <main class="container">
      <section class="form-box">
        <h1>Cadastrar usuário</h1>
        <form id="form-cadastro">
          <label>
            Nome do usuário
            <input type="text" id="nome" required>
          </label>
          <label>
            E-mail
            <input type="email" id="email" required>
          </label>
          <div class="form-acoes">
            <button class="btn" type="submit">Cadastrar</button>
            <button class="btn btn-sec" type="button" id="btn-limpar">
              Limpar campos
            </button>
          </div>
        </form>
      </section>

      <section class="usuarios">
        <h2>Usuários cadastrados</h2>
        <div class="usuarios-barra">
          <label>
            Pesquisar por nome ou e-mail
            <input type="search" id="busca">
          </label>
          <button class="btn btn-sec" type="button" id="btn-excluir-todos">
            Excluir todos
          </button>
        </div>
        <p class="aviso-lista" id="aviso-lista"></p>
        <ul class="lista-usuarios" id="lista-usuarios"></ul>
      </section>
    </main>

    <footer class="rodape">
      <p>
        Feito por Luiz Henrique Felix para a disciplina ES44C - Programação Web
        Front-End, UTFPR.
      </p>
      <a href="./curriculo.pdf">
        <i class="bi bi-file-earmark-person" aria-hidden="true"></i>
        Meu Currículo
      </a>
    </footer>

    <script src="./script/admin.js"></script>
  </body>
</html>
